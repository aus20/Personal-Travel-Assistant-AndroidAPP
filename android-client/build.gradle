// Top-level build file where you can add configuration options common to all sub-projects/modules.
// This file is the main configuration file for the entire project build system.
// It defines project-wide dependencies and settings.

buildscript {
    // Extension block to define variables that can be used throughout the project
    // These versions will be used by all modules in the project
    ext {
        // Version of the Android Gradle plugin
        agp_version = '8.4.1'
        // Version of the Kotlin Gradle plugin
        //kotlin_version = '1.9.21'
        kotlin_version = "2.1.10"
        // Version of the Compose library
        compose_version = '1.5.13'
        // Version of KSP
        //ksp_version = '1.9.21-1.0.15'
        ksp_version    = "2.1.21-2.0.1"
        // Version of Room
        room_version = '2.7.0'
        // Version of Navigation Compose
        nav_version = '2.7.6'
        hilt_version   = "2.56.2"
    }

    // Dependencies required for the build system itself
    // These are NOT app dependencies
    dependencies {
        // The Android Gradle Plugin - core build tool for Android projects
        classpath "com.android.tools.build:gradle:$agp_version"
        // Kotlin Gradle Plugin - enables Kotlin support in the project
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        //classpath 'com.google.gms:google-services:4.3.15' // Veya daha güncel bir versiyon
    }

    repositories {
        google()
        mavenCentral()
    }
    configurations.configureEach {
        resolutionStrategy {
            // force the JavaPoet version that has .canonicalName()
            force 'com.squareup:javapoet:1.13.0'
        }
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.4.1' apply false // ext bloğunu kullanmak daha tutarlı
    id 'com.android.library' version '8.4.1' apply false     // ext bloğunu kullanmak daha tutarlı
    id 'org.jetbrains.kotlin.android' version '2.1.10' apply false // DÜZELTİLDİ (2.0.0 kullanacak)
    //id 'org.jetbrains.kotlin.plugin.compose' version '1.9.x' apply false // YENİ EKLENDİ (Kotlin 2.0.0 ile Compose için)
    id 'com.google.devtools.ksp' version "2.1.21-2.0.1" apply false       // DÜZELTİLDİ (2.0.0-1.0.21 kullanacak)
    id 'com.google.gms.google-services' version '4.4.2' apply false // Bu versiyon güncel ve iyi
    id "com.google.dagger.hilt.android" version "2.56.2"   apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.10" apply false  // ← new!

}

// Configure all Android projects
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion 34
                
                defaultConfig {
                    minSdk 24
                    targetSdk 34
                }
                
                // Add JVM arguments for Java compilation
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

// Configure all projects in the build
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Clean task for removing build directories
tasks.register('clean', Delete) {
    delete rootProject.buildDir
} 